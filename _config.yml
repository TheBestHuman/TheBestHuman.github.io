      - layout: left
        border: weak  # Value of `weak` will display a weak border below this item. # Any 
                      # other value (or no value) means no border will be displayed
        title: LLM Application Security Scanner
        link: https://gitlab.com/TheBestHuman/llm-application-security-scanner
        link_text: LLM Application Security Scanner
        additional_links:
          - title: LLM Application Security Scanner on GitLab
            icon: fa fa-gitlab
            url: https://gitlab.com/TheBestHuman/llm-application-security-scanner
        quote: >
          A GitLab CI security reviewer that uses OpenAI to analyze merge requests, post Markdown findings, and fail only on High or Critical issues.
        description: | # this will include new lines to allow paragraphs
          GitLab LLM Security Reviewer is a minimal Python tool for reviewing merge requests in GitLab CI with OpenAI.

          It posts a Markdown review comment to the merge request and exits non-zero only when findings include High or Critical severity.

          The project also reports approximate token usage and cost, which makes it easier to understand review overhead in CI.
      - layout: left
        border: weak  # Value of `weak` will display a weak border below this item. # Any 
                      # other value (or no value) means no border will be displayed
        title: Melticulous
        link: https://www.melticulous.com
        link_text: Melticulous
        additional_links:
          - title: Melticulous website
            icon: fa fa-globe
            url: https://www.melticulous.com
        quote: >
          A browser-based app that turns your images into Perler bead patterns.
        description: | # this will include new lines to allow paragraphs
          Melticulous converts photos and other images into printable Perler bead patterns, helping makers turn personal pictures, landscapes, and pixel-art ideas into bead projects.

          It generates a clean grid layout, reduces the image to a practical bead palette, and provides the visual guidance needed to recreate the design accurately.

          Because it runs entirely in the browser, users can create patterns without sending their images to a backend service.
      - layout: left
        border: weak  # Value of `weak` will display a weak border below this item. # Any 
                      # other value (or no value) means no border will be displayed
        title: BeadMap
        link: https://gitlab.com/TheBestHuman/beadmap
        link_text: BeadMap
        additional_links:
          - title:  BeadMap on GitLab
            icon: fa fa-gitlab
            url: https://gitlab.com/TheBestHuman/beadmap
        quote: >
          An open-source bead pattern generator focused on image conversion and reproducible planning.
        description: | # this will include new lines to allow paragraphs
          BeadMap is an earlier, code-centric take on the same creative space: converting arbitrary images into structured bead plans that makers can actually follow.

          It focuses on the underlying transformation problem, including image pixelation, color quantization, mosaic reconstruction, and generation of a practical legend and shopping list.

          The project is built with <b>Node.js</b>, <b>Docker</b>, and <b>JavaScript</b>, and I keep it featured as an open-source implementation of the core pattern-generation idea.
